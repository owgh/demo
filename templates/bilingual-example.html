<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Playfair+Display:wght@700;900&family=Noto+Sans+Arabic:wght@400;600;800&family=Noto+Naskh+Arabic:wght@700&display=swap" rel="stylesheet">
<style>
  :root { --ink: #1c1712; --muted: #6f665b; --line: #e8e0d4; --bg: #faf6ef; --surface: #fff; --brand: __BRAND__; --brand-soft: __BRAND_SOFT__; --green: #2f6b4c;
          --head: __HEAD__; --sans: 'DM Sans', 'Noto Sans Arabic', system-ui, -apple-system, sans-serif; --serif: 'Playfair Display', 'Noto Naskh Arabic', Georgia, serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; overflow-x: hidden; }
  body { font: 400 16px/1.5 var(--sans); color: var(--ink); background: var(--bg); padding-bottom: calc(var(--obh, 120px) + 90px); }
  .wrap { max-width: 860px; margin: 0 auto; padding: 0 16px; }
  header { background: var(--head); color: #fff; padding: 18px 0 18px; }
  .toprow { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .langs { display: inline-flex; background: rgba(255,255,255,.14); border-radius: 999px; padding: 3px; }
  .langs button { border: 0; background: transparent; color: #fff; font: 700 .9rem var(--sans); padding: 7px 14px; border-radius: 999px; cursor: pointer; min-height: 36px; }
  .langs button[aria-pressed="true"] { background: #fff; color: var(--brand); }
  .name { font: 900 clamp(1.8rem, 7vw, 2.4rem)/1.1 var(--serif); margin: 14px 0 0; }
  .tag { margin: 6px 0 0; color: rgba(255,255,255,.85); }
  .meta { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: .92rem; color: rgba(255,255,255,.85); }
  .open { color: #fff; font-weight: 700; }
  .open::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #6ee7a8; margin-inline-end: 6px; vertical-align: 1px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .actions a { text-decoration: none; font-weight: 700; font-size: .95rem; padding: 10px 16px; border-radius: 999px; background: #fff; color: var(--brand); }
  .actions a.alt { background: rgba(255,255,255,.14); color: #fff; }
  .note-top { margin: 16px 0 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; font-size: .92rem; color: var(--muted); }
  .tabs { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
  .tabs .wrap { display: flex; gap: 6px; overflow-x: auto; padding-top: 10px; padding-bottom: 10px; scrollbar-width: none; }
  .tabs a { flex: none; text-decoration: none; color: var(--ink); font-weight: 600; font-size: .92rem; padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); }
  section.cat { padding-top: 18px; scroll-margin-top: 60px; }
  section.cat h2 { font: 700 1.3rem var(--serif); margin: 0 0 10px; }
  .items { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
  .item { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: start; }
  .item h3 { margin: 0; font-size: 1rem; }
  .item p { margin: 0; color: var(--muted); font-size: .88rem; grid-column: 1; }
  .item .price { font-weight: 700; grid-column: 1; margin-top: 4px; direction: ltr; unicode-bidi: isolate; }
  .add { grid-column: 2; grid-row: 1 / span 3; align-self: center; border: 0; border-radius: 999px; background: var(--brand-soft); color: var(--brand); font: 700 .95rem var(--sans); min-width: 44px; min-height: 40px; padding: 0 14px; cursor: pointer; }
  .add.in { background: var(--brand); color: #fff; }
  .info { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); margin-top: 22px; }
  .info div { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  .info h3 { margin: 0 0 4px; font-size: 1rem; }
  .info p { margin: 0; color: var(--muted); font-size: .92rem; }
  .cartbar { position: fixed; left: 0; right: 0; bottom: calc(var(--obh, 120px) + 10px); z-index: 40; padding: 0 16px; display: none; }
  .cartbar.show { display: block; }
  .cartbar button { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 560px; margin: 0 auto; border: 0; border-radius: 999px; background: var(--brand); color: #fff; font: 700 1rem var(--sans); padding: 15px 20px; cursor: pointer; box-shadow: 0 10px 24px rgba(0,0,0,.2); }
  .sheet { position: fixed; inset: 0; z-index: 60; background: rgba(28,23,18,.5); display: none; align-items: flex-end; justify-content: center; }
  .sheet.show { display: flex; }
  .panel { background: var(--surface); width: 100%; max-width: 560px; border-radius: 20px 20px 0 0; padding: 18px 18px calc(18px + env(safe-area-inset-bottom, 0px)); max-height: 85vh; overflow-y: auto; }
  .panel h2 { font: 700 1.4rem var(--serif); margin: 0 0 4px; }
  .panel .sub { color: var(--muted); font-size: .9rem; margin: 0 0 12px; }
  .line { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .qty { display: inline-flex; align-items: center; gap: 8px; }
  .qty button { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg); font: 700 1.05rem var(--sans); cursor: pointer; }
  .totals { display: grid; gap: 4px; margin-top: 12px; font-size: .95rem; }
  .totals div { display: flex; justify-content: space-between; }
  .totals .grand { font-weight: 700; font-size: 1.1rem; border-top: 2px solid var(--ink); padding-top: 8px; margin-top: 4px; }
  .money { direction: ltr; unicode-bidi: isolate; }
  .primary { width: 100%; border: 0; border-radius: 999px; background: var(--brand); color: #fff; font: 700 1.05rem var(--sans); padding: 15px; cursor: pointer; margin-top: 14px; }
  .ghost { width: 100%; border: 0; background: none; color: var(--muted); font: 600 .95rem var(--sans); padding: 10px; cursor: pointer; }
  .note { background: var(--brand-soft); border-radius: 12px; padding: 12px 14px; font-size: .92rem; margin-top: 12px; }
  .offer-bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; background: #121110; color: #fff; padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
    display: flex; align-items: center; justify-content: center; gap: 8px 16px; flex-wrap: wrap; font-size: 14px; line-height: 1.35; box-shadow: 0 -8px 28px rgba(0,0,0,.28); }
  .offer-bar .t { max-width: 620px; }
  .offer-bar small { display: block; color: #c9c3b6; font-size: 12.5px; margin-top: 2px; }
  .offer-bar a { background: #f0b239; color: #121110; text-decoration: none; font-weight: 700; padding: 10px 16px; border-radius: 999px; white-space: nowrap; }
  button:focus-visible, a:focus-visible { outline: 2px solid #f0b239; outline-offset: 2px; }
  [dir="rtl"] body, body[dir="rtl"] { text-align: right; }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="toprow">
      <span class="meta"><span class="open" data-t="open"></span></span>
      <div class="langs" role="group" aria-label="Language">
        <button type="button" data-lang="en" aria-pressed="true">English</button>
        <button type="button" data-lang="__L2__" aria-pressed="false">__L2NAME__</button>
      </div>
    </div>
    <h1 class="name" data-t="name"></h1>
    <p class="tag" data-t="tag"></p>
    <div class="meta"><span data-t="ready"></span><span data-t="area"></span></div>
    <div class="actions"><a href="#menu" data-t="orderBtn"></a><a class="alt" href="#info" data-t="callBtn"></a></div>
  </div>
</header>

<nav class="tabs" aria-label="Menu"><div class="wrap" id="tabs"></div></nav>

<main class="wrap">
  <p class="note-top" data-t="topNote"></p>
  <div id="menu"></div>
  <div class="info" id="info">
    <div><h3 data-t="hoursH"></h3><p data-t="hours"></p></div>
    <div><h3 data-t="giftH"></h3><p data-t="gift"></p></div>
    <div><h3 data-t="findH"></h3><p data-t="find"></p></div>
  </div>
</main>

<div class="cartbar" id="cartbar"><button type="button" id="openCart"><span id="cartCount"></span><span id="cartTotal" class="money">$0.00</span></button></div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="panel">
    <div id="cartView">
      <h2 id="sheetTitle" data-t="yourOrder"></h2>
      <p class="sub" data-t="pickupLine"></p>
      <div id="lines"></div>
      <div class="totals" id="totals"></div>
      <button class="primary" type="button" id="checkout" data-t="place"></button>
      <button class="ghost" type="button" id="closeCart" data-t="keep"></button>
    </div>
    <div id="doneView" hidden>
      <h2 data-t="exampleH"></h2>
      <p class="sub" data-t="exampleP"></p>
      <button class="primary" type="button" id="closeDone" data-t="gotIt"></button>
    </div>
  </div>
</div>

<div class="offer-bar" role="region" aria-label="About this example">
  <div class="t"><b data-t="barB"></b> <span data-t="barT"></span><small data-t="barS"></small></div>
  <a id="smsLink" href="#" data-t="barA"></a>
</div>

<script>
(function () {
  var CFG = __CONFIG__;
  var lang = 'en', cart = {};
  var byId = {}; CFG.menu.forEach(function (c) { c.items.forEach(function (i) { byId[i.id] = i; }); });
  function T(k) { return (CFG.strings[lang] || {})[k] || CFG.strings.en[k] || ''; }
  function money(n) { return '$' + n.toFixed(2); }
  function el(t, c, txt) { var e = document.createElement(t); if (c) e.className = c; if (txt != null) e.textContent = txt; return e; }
  var tabs = document.getElementById('tabs'), menu = document.getElementById('menu');

  function build() {
    tabs.innerHTML = ''; menu.innerHTML = '';
    CFG.menu.forEach(function (c) {
      var a = el('a', null, c.name[lang]); a.href = '#' + c.id; tabs.appendChild(a);
      var s = el('section', 'cat'); s.id = c.id; s.appendChild(el('h2', null, c.name[lang]));
      var grid = el('div', 'items');
      c.items.forEach(function (i) {
        var card = el('div', 'item');
        card.appendChild(el('h3', null, i.name[lang])); card.appendChild(el('p', null, i.desc[lang])); card.appendChild(el('span', 'price', money(i.price)));
        var b = el('button', 'add'); b.type = 'button'; b.dataset.id = i.id; b.setAttribute('aria-label', T('add') + ' ' + i.name[lang]);
        b.addEventListener('click', function () { cart[i.id] = (cart[i.id] || 0) + 1; render(); });
        card.appendChild(b); grid.appendChild(card);
      });
      s.appendChild(grid); menu.appendChild(s);
    });
  }
  function totals() {
    var sub = 0, n = 0; Object.keys(cart).forEach(function (k) { sub += byId[k].price * cart[k]; n += cart[k]; });
    var tax = sub * CFG.tax; return { sub: sub, tax: tax, total: sub + tax, n: n };
  }
  function render() {
    var t = totals();
    document.querySelectorAll('.add').forEach(function (b) { var q = cart[b.dataset.id] || 0; b.textContent = q ? T('added').replace('{n}', q) : T('add'); b.classList.toggle('in', q > 0); });
    document.getElementById('cartbar').classList.toggle('show', t.n > 0);
    document.getElementById('cartCount').textContent = T('viewOrder').replace('{n}', t.n);
    document.getElementById('cartTotal').textContent = money(t.total);
    var lines = document.getElementById('lines'); lines.innerHTML = '';
    Object.keys(cart).forEach(function (k) {
      var i = byId[k], row = el('div', 'line');
      row.appendChild(el('span', null, i.name[lang]));
      var q = el('span', 'qty');
      var minus = el('button', null, '−'); minus.type = 'button'; minus.setAttribute('aria-label', '−1 ' + i.name[lang]);
      minus.addEventListener('click', function () { cart[k]--; if (cart[k] <= 0) delete cart[k]; render(); if (!totals().n) closeSheet(); });
      var plus = el('button', null, '+'); plus.type = 'button'; plus.setAttribute('aria-label', '+1 ' + i.name[lang]);
      plus.addEventListener('click', function () { cart[k]++; render(); });
      q.appendChild(minus); q.appendChild(el('span', null, String(cart[k]))); q.appendChild(plus);
      row.appendChild(q); row.appendChild(el('b', 'money', money(i.price * cart[k])));
      lines.appendChild(row);
    });
    var tt = document.getElementById('totals'); tt.innerHTML = '';
    function tr(label, v, cls) { var d = el('div', cls); d.appendChild(el('span', null, label)); d.appendChild(el('span', 'money', money(v))); tt.appendChild(d); }
    tr(T('subtotal'), t.sub); tr(T('hst'), t.tax); tr(T('total'), t.total, 'grand');
  }
  function setLang(l) {
    lang = l;
    var rtl = CFG.rtl && l !== 'en';
    document.documentElement.lang = l; document.documentElement.dir = rtl ? 'rtl' : 'ltr';
    document.querySelectorAll('[data-lang]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.lang === l)); });
    document.querySelectorAll('[data-t]').forEach(function (e) { e.textContent = T(e.dataset.t); });
    document.title = T('docTitle');
    document.getElementById('smsLink').href = 'sms:+13435975450?&body=' + encodeURIComponent(T('smsBody'));
    build(); render(); fit();
  }
  document.querySelectorAll('[data-lang]').forEach(function (b) { b.addEventListener('click', function () { setLang(b.dataset.lang); }); });
  var sheet = document.getElementById('sheet');
  function openSheet() { document.getElementById('cartView').hidden = false; document.getElementById('doneView').hidden = true; sheet.classList.add('show'); }
  function closeSheet() { sheet.classList.remove('show'); }
  document.getElementById('openCart').addEventListener('click', openSheet);
  document.getElementById('closeCart').addEventListener('click', closeSheet);
  document.getElementById('checkout').addEventListener('click', function () { document.getElementById('cartView').hidden = true; document.getElementById('doneView').hidden = false; });
  document.getElementById('closeDone').addEventListener('click', closeSheet);
  sheet.addEventListener('click', function (e) { if (e.target === sheet) closeSheet(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSheet(); });
  function fit() { var bar = document.querySelector('.offer-bar'); if (bar) document.documentElement.style.setProperty('--obh', bar.offsetHeight + 'px'); }
  window.addEventListener('resize', fit); window.addEventListener('load', fit);
  var start = (location.hash || '').replace('#', '');
  setLang(start === CFG.l2 ? CFG.l2 : (CFG.startL2 ? CFG.l2 : 'en'));
})();
</script>
</body>
</html>
